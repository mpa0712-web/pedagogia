<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pédagogia — Messagerie</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sage:#3D6B4F;--sage-l:#5A8C6A;--sage-p:#EAF2ED;
  --terra:#B8623A;--terra-p:#FBF0EA;
  --ink:#1A1714;--ink-60:#5C574F;--ink-30:#A09990;--ink-10:#F0EBE3;
  --sand:#FAF6F0;--white:#fff;
  --blue:#1A4F9C;--blue-p:#EBF2FF;
  --purple:#5B2E9C;--purple-p:#F3EEFF;
  --amber:#9C6B1E;--amber-p:#FDF5E6;
  --r:12px;--sh:0 1px 3px rgba(26,23,20,.07);--sh-md:0 4px 16px rgba(26,23,20,.10);
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--sand);color:var(--ink)}
.app{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:var(--ink);display:flex;flex-direction:column}
.s-logo{padding:16px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.s-logo-ic{width:32px;height:32px;border-radius:9px;background:var(--sage-l);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.s-logo-wm{font-family:'Lora',serif;font-size:16px;font-weight:700;color:#fff}
.s-logo-tg{font-size:9px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}
.s-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border-radius:9px;margin:2px 6px;transition:all .1s}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.nav-item.active{background:var(--sage-l);color:#fff}
.nav-sep{height:1px;background:rgba(255,255,255,.06);margin:6px 14px}
.s-bottom{padding:10px 8px;border-top:1px solid rgba(255,255,255,.06)}
.s-logout{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:11px;color:rgba(255,255,255,.4);cursor:pointer;transition:all .1s;width:100%;border:none;background:transparent;font-family:'DM Sans',sans-serif}
.s-logout:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7)}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;flex-shrink:0;background:var(--white);border-bottom:1px solid var(--ink-10);display:flex;align-items:center;padding:0 18px;gap:10px}
.topbar-title{font-size:15px;font-weight:600;font-family:'Lora',serif}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:7px}
.content{flex:1;overflow-y:auto;padding:20px}
.screen{display:none;animation:fi .2s ease}.screen.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .12s;white-space:nowrap}
.btn-p{background:var(--sage-l);color:#fff}.btn-p:hover{background:var(--sage)}
.btn-g{background:transparent;color:var(--ink-60);border:1.5px solid var(--ink-10)}.btn-g:hover{background:var(--ink-10)}
.btn-sm{padding:4px 9px;font-size:10.5px}
.badge{padding:2px 7px;border-radius:7px;font-size:9.5px;font-weight:700}
.bg{background:var(--sage-p);color:var(--sage)}.bt{background:var(--terra-p);color:var(--terra)}
.ba{background:var(--amber-p);color:var(--amber)}.bb{background:var(--blue-p);color:var(--blue)}
.bp{background:var(--purple-p);color:var(--purple)}.binf{background:#E8F4FD;color:#1565C0}
.empty{padding:32px;text-align:center;color:var(--ink-30)}
.empty-ic{font-size:32px;margin-bottom:8px}.empty-txt{font-size:12.5px;line-height:1.6}

/* MESSAGERIE */
.msg-layout{display:grid;grid-template-columns:280px 1fr;gap:0;height:calc(100vh - 92px);background:var(--white);border:1px solid var(--ink-10);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.conv-list{border-right:1px solid var(--ink-10);display:flex;flex-direction:column;overflow:hidden}
.conv-search{padding:10px;border-bottom:1px solid var(--ink-10)}
.conv-search input{width:100%;padding:7px 10px;border-radius:8px;border:1.5px solid var(--ink-10);font-size:12px;background:var(--sand);outline:none;font-family:'DM Sans',sans-serif;transition:border .15s}
.conv-search input:focus{border-color:var(--sage-l)}
.conv-items{flex:1;overflow-y:auto}
.conv-item{padding:11px 13px;cursor:pointer;transition:background .1s;border-bottom:1px solid rgba(26,23,20,.04);display:flex;align-items:center;gap:10px}
.conv-item:hover{background:var(--sand)}
.conv-item.active{background:var(--sage-p)}
.conv-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.conv-name{font-size:12.5px;font-weight:600}
.conv-preview{font-size:11px;color:var(--ink-30);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-time{font-size:10px;color:var(--ink-30);flex-shrink:0;align-self:flex-start;margin-top:2px}
.conv-unread{width:8px;height:8px;border-radius:50%;background:var(--sage-l);flex-shrink:0}

/* Chat */
.chat-area{display:flex;flex-direction:column;height:100%}
.chat-hd{padding:13px 16px;border-bottom:1px solid var(--ink-10);display:flex;align-items:center;gap:10px}
.chat-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.chat-name{font-size:13px;font-weight:600}
.chat-meta{font-size:10.5px;color:var(--ink-30);margin-top:1px}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--sand)}
.msg-bubble{max-width:68%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.6;position:relative}
.msg-mine{background:var(--sage-l);color:#fff;align-self:flex-end;border-radius:12px 12px 3px 12px}
.msg-other{background:var(--white);color:var(--ink-60);align-self:flex-start;border-radius:12px 12px 12px 3px;border:1px solid var(--ink-10)}
.msg-time{font-size:9.5px;opacity:.6;margin-top:4px;display:block}
.chat-input{padding:10px 13px;border-top:1px solid var(--ink-10);display:flex;gap:8px;align-items:flex-end;background:var(--white)}
.chat-input textarea{flex:1;padding:8px 11px;border-radius:9px;border:1.5px solid var(--ink-10);font-size:12.5px;resize:none;min-height:38px;max-height:100px;outline:none;font-family:'DM Sans',sans-serif;background:var(--sand);transition:border .15s}
.chat-input textarea:focus{border-color:var(--sage-l)}
.send-btn{padding:9px 14px;background:var(--sage-l);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:16px;flex-shrink:0;transition:background .1s}
.send-btn:hover{background:var(--sage)}

/* ANNONCES */
.ann-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ann-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ann-filter{padding:5px 11px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--ink-10);background:var(--white);color:var(--ink-60);transition:all .1s;font-family:'DM Sans',sans-serif}
.ann-filter:hover,.ann-filter.active{border-color:var(--sage-l);background:var(--sage-p);color:var(--sage)}
.ann-card{background:var(--white);border:1px solid var(--ink-10);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ann-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.ann-av{width:36px;height:36px;border-radius:50%;background:var(--sage-l);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.ann-info{flex:1}
.ann-author{font-size:12.5px;font-weight:600}
.ann-meta{font-size:10.5px;color:var(--ink-30);margin-top:2px}
.ann-body{font-size:13px;line-height:1.7;color:var(--ink-60);margin-bottom:12px}
.ann-footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ann-like{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-30);cursor:pointer;padding:4px 9px;border-radius:6px;transition:all .1s;border:1px solid var(--ink-10);background:transparent;font-family:'DM Sans',sans-serif}
.ann-like:hover{background:var(--terra-p);color:var(--terra)}
.ann-like.liked{background:var(--terra-p);color:var(--terra)}
.ann-comments{background:var(--sand);border-radius:9px;padding:10px 12px;margin-top:10px;display:none}
.ann-comments.open{display:block}
.comment-item{padding:7px 0;border-bottom:1px solid var(--ink-10);font-size:12px;color:var(--ink-60)}
.comment-item:last-child{border:none}
.comment-author{font-weight:600;margin-right:6px}
.add-comment{display:flex;gap:7px;margin-top:8px}
.add-comment input{flex:1;padding:7px 10px;border-radius:8px;border:1.5px solid var(--ink-10);font-size:12px;background:var(--white);outline:none;font-family:'DM Sans',sans-serif}
.add-comment input:focus{border-color:var(--sage-l)}

/* NOTIFS */
.notif-item{background:var(--white);border:1px solid var(--ink-10);border-radius:9px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:11px;transition:all .1s;box-shadow:var(--sh)}
.notif-item.unread{border-left:3px solid var(--sage-l)}
.notif-ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--sand)}
.notif-title{font-size:12.5px;font-weight:600}
.notif-body{font-size:11.5px;color:var(--ink-60);margin-top:2px;line-height:1.5}
.notif-time{font-size:10px;color:var(--ink-30);margin-top:3px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,23,20,.5);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:16px;width:520px;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(26,23,20,.2)}
.modal-title{font-family:'Lora',serif;font-size:17px;font-weight:700;margin-bottom:3px}
.modal-sub{font-size:11.5px;color:var(--ink-60);margin-bottom:18px}
.modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-30)}
.modal-footer{display:flex;justify-content:flex-end;gap:7px;margin-top:18px;padding-top:14px;border-top:1px solid var(--ink-10)}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:10.5px;font-weight:700;color:var(--ink-60);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 11px;border-radius:8px;border:1.5px solid var(--ink-10);font-size:12.5px;color:var(--ink);background:var(--sand);outline:none;font-family:'DM Sans',sans-serif;transition:border .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--sage-l)}
.fg textarea{resize:vertical;min-height:80px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:12.5px;font-weight:500;z-index:999;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--sage-l)}.toast.error{background:var(--terra)}
</style>
</head>
<body>
<div class="app">
<nav class="sidebar">
  <div class="s-logo">
    <div class="s-logo-ic">🎓</div>
    <div><div class="s-logo-wm">Pédagogia</div><div class="s-logo-tg">Communication</div></div>
  </div>
  <div class="s-nav">
    <div class="nav-item" onclick="window.location.href='dashboard.html'">⌂ Accueil</div>
    <div class="nav-sep"></div>
    <div class="nav-item active" id="nav-messagerie" onclick="showScreen('messagerie')">✉️ Messagerie</div>
    <div class="nav-item" id="nav-annonces" onclick="showScreen('annonces')">📢 Annonces</div>
    <div class="nav-item" id="nav-notifs" onclick="showScreen('notifs')">🔔 Notifications</div>
    <div class="nav-sep"></div>
    <div class="nav-item" onclick="window.location.href='murs.html'">🗂 Murs</div>
    <div class="nav-item" onclick="window.location.href='suivi.html'">📊 Suivi</div>
  </div>
  <div class="s-bottom">
    <button class="s-logout" onclick="logout()">↩ Déconnexion</button>
  </div>
</nav>
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="page-title">Messagerie</div>
    <div class="topbar-right">
      <button class="btn btn-p btn-sm" id="topbar-btn" onclick="openNewAnnonce()">+ Annonce</button>
    </div>
  </div>
  <div class="content" style="padding:0">

    <!-- ═ MESSAGERIE ═ -->
    <div id="screen-messagerie" class="screen active" style="height:100%;padding:0">
      <div class="msg-layout">
        <!-- Conversations -->
        <div class="conv-list">
          <div style="padding:10px 13px;border-bottom:1px solid var(--ink-10);display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:12px;font-weight:700">Messages</span>
            <button class="btn btn-p btn-sm" onclick="openNewMsg()">+ Nouveau</button>
          </div>
          <div class="conv-search"><input placeholder="Rechercher…" oninput="filterConvs(this.value)" id="conv-search"></div>
          <div class="conv-items" id="conv-list"></div>
        </div>
        <!-- Zone chat -->
        <div class="chat-area" id="chat-area">
          <div style="flex:1;display:flex;align-items:center;justify-content:center;background:var(--sand)">
            <div style="text-align:center;color:var(--ink-30)">
              <div style="font-size:36px;margin-bottom:10px">✉️</div>
              <div style="font-size:13px;font-weight:600">Sélectionne une conversation</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ═ ANNONCES ═ -->
    <div id="screen-annonces" class="screen" style="padding:20px">
      <div class="ann-hd">
        <div>
          <div style="font-size:15px;font-weight:700;font-family:'Lora',serif">Annonces</div>
          <div style="font-size:11.5px;color:var(--ink-30);margin-top:2px">Publie des actualités pour tes classes</div>
        </div>
        <button class="btn btn-p" onclick="openNewAnnonce()">+ Nouvelle annonce</button>
      </div>
      <div class="ann-filters">
        <button class="ann-filter active" onclick="filterAnn('all',this)">Toutes</button>
        <button class="ann-filter" onclick="filterAnn('cours',this)">📚 Cours</button>
        <button class="ann-filter" onclick="filterAnn('evaluation',this)">📝 Évaluation</button>
        <button class="ann-filter" onclick="filterAnn('devoir',this)">📋 Devoir</button>
        <button class="ann-filter" onclick="filterAnn('felicitations',this)">🏆 Félicitations</button>
        <button class="ann-filter" onclick="filterAnn('info',this)">ℹ Info</button>
        <button class="ann-filter" onclick="filterAnn('rappel',this)">⏰ Rappel</button>
      </div>
      <div id="annonces-list"></div>
    </div>

    <!-- ═ NOTIFICATIONS ═ -->
    <div id="screen-notifs" class="screen" style="padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div style="font-size:15px;font-weight:700;font-family:'Lora',serif">Notifications</div>
        <button class="btn btn-g btn-sm" onclick="markAllRead()">✓ Tout lire</button>
      </div>
      <div id="notifs-list"></div>
    </div>

  </div>
</div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBYOQopUVm5vcjUur74ErhvehWC-UNiaz0",
  authDomain: "pedagogia-18dda.firebaseapp.com",
  projectId: "pedagogia-18dda",
  storageBucket: "pedagogia-18dda.firebasestorage.app",
  messagingSenderId: "465869483173",
  appId: "1:465869483173:web:5874b245342c020127b14c"
};
var TS = firebase.firestore.FieldValue.serverTimestamp;
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db   = firebase.firestore();

var currentUser   = null;
var currentConvId = null;
var allAnnonces   = [];
var annFilter     = 'all';
var convs         = [];

// ── AUTH ──────────────────────────────────────────────────
auth.onAuthStateChanged(function(user) {
  if (!user) { window.location.href = 'index.html'; return; }
  currentUser = user;
  loadConvs();
  loadAnnonces();
  loadNotifs();
});
function logout() { auth.signOut().then(function() { window.location.href = 'index.html'; }); }

// ── NAV ───────────────────────────────────────────────────
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById('screen-' + name).classList.add('active');
  var titles = { messagerie:'Messagerie', annonces:'Annonces', notifs:'Notifications' };
  document.getElementById('page-title').textContent = titles[name] || name;
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  var el = document.getElementById('nav-' + name);
  if (el) el.classList.add('active');
  var btn = document.getElementById('topbar-btn');
  btn.textContent = name === 'annonces' ? '+ Annonce' : name === 'messagerie' ? '+ Message' : '';
  btn.onclick = name === 'annonces' ? openNewAnnonce : name === 'messagerie' ? openNewMsg : function(){};
}
function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (type || ''); t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3200);
}
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function timeAgo(ts) {
  if (!ts) return '—';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  var s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return 'À l\'instant';
  if (s < 3600) return 'Il y a ' + Math.floor(s/60) + ' min';
  if (s < 86400) return 'Il y a ' + Math.floor(s/3600) + 'h';
  return d.toLocaleDateString('fr-FR');
}

// ────────────────────────────────────────────────────────────
// ═══ MESSAGERIE ═══
// ────────────────────────────────────────────────────────────
function loadConvs() {
  db.collection('messages').where('participants', 'array-contains', currentUser.uid)
  .orderBy('updatedAt', 'desc').get()
  .then(function(snap) {
    convs = snap.docs.map(function(d) { return { id: d.id, data: d.data() }; });
    renderConvList(convs);
  }).catch(function() {
    // Données démo si pas de messages
    convs = [
      { id:'d1', data:{ name:'Élèves Terminale', lastMsg:'Bonjour Madame !', updatedAt:null, unread:true, color:'var(--sage-l)' }},
      { id:'d2', data:{ name:'Direction', lastMsg:'Réunion demain à 14h', updatedAt:null, unread:false, color:'var(--blue)' }}
    ];
    renderConvList(convs);
  });
}

function renderConvList(list) {
  var el = document.getElementById('conv-list');
  if (!list.length) { el.innerHTML = '<div class="empty" style="padding:24px"><div class="empty-ic">✉️</div><div class="empty-txt">Aucun message.</div></div>'; return; }
  el.innerHTML = list.map(function(c) {
    var fd   = c.data;
    var name = fd.name || 'Conversation';
    var init = name.split(' ').map(function(n){ return n[0]; }).join('').toUpperCase().slice(0,2);
    var color = fd.color || 'var(--sage-l)';
    return '<div class="conv-item" id="conv-' + c.id + '" onclick="openConv(\'' + c.id + '\')">' +
      '<div class="conv-av" style="background:' + color + '">' + init + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="conv-name">' + name + '</div>' +
        '<div class="conv-preview">' + (fd.lastMsg || '…') + '</div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">' +
        '<div class="conv-time">' + timeAgo(fd.updatedAt) + '</div>' +
        (fd.unread ? '<div class="conv-unread"></div>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function filterConvs(q) {
  var filtered = convs.filter(function(c) { return (c.data.name || '').toLowerCase().includes(q.toLowerCase()); });
  renderConvList(filtered);
}

function openConv(id) {
  currentConvId = id;
  document.querySelectorAll('.conv-item').forEach(function(c) { c.classList.remove('active'); });
  var el = document.getElementById('conv-' + id);
  if (el) el.classList.add('active');

  var conv = convs.find(function(c) { return c.id === id; });
  var fd   = conv ? conv.data : {};
  var name = fd.name || 'Conversation';
  var init = name.split(' ').map(function(n){ return n[0]; }).join('').toUpperCase().slice(0,2);
  var color = fd.color || 'var(--sage-l)';

  var area = document.getElementById('chat-area');
  area.innerHTML =
    '<div class="chat-hd">' +
      '<div class="chat-av" style="background:' + color + '">' + init + '</div>' +
      '<div><div class="chat-name">' + name + '</div><div class="chat-meta">Conversation</div></div>' +
    '</div>' +
    '<div class="chat-msgs" id="chat-msgs"></div>' +
    '<div class="chat-input">' +
      '<textarea id="msg-input" placeholder="Écrire un message…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendMsg()}" rows="1"></textarea>' +
      '<button class="send-btn" onclick="sendMsg()">↗</button>' +
    '</div>';

  loadMsgs(id);
}

function loadMsgs(convId) {
  db.collection('messages').doc(convId).collection('msgs').orderBy('createdAt', 'asc').get()
  .then(function(snap) {
    var el = document.getElementById('chat-msgs');
    if (!el) return;
    if (snap.empty) { el.innerHTML = '<div class="empty" style="padding:20px"><div class="empty-txt">Commence la conversation !</div></div>'; return; }
    el.innerHTML = snap.docs.map(function(d) {
      var fd   = d.data();
      var mine = fd.uid === currentUser.uid;
      return '<div class="msg-bubble ' + (mine ? 'msg-mine' : 'msg-other') + '">' +
        fd.text +
        '<span class="msg-time">' + timeAgo(fd.createdAt) + '</span>' +
      '</div>';
    }).join('');
    el.scrollTop = el.scrollHeight;
  }).catch(function() {
    var el = document.getElementById('chat-msgs');
    if (el) el.innerHTML = '<div class="msg-bubble msg-other">Bonjour ! Comment puis-je vous aider ? 👋<span class="msg-time">Hier</span></div>';
  });
}

function sendMsg() {
  var input = document.getElementById('msg-input');
  var text  = (input ? input.value : '').trim();
  if (!text || !currentConvId) return;
  input.value = '';
  var msgData = { uid: currentUser.uid, text: text, createdAt: TS() };
  db.collection('messages').doc(currentConvId).collection('msgs').add(msgData)
  .then(function() {
    db.collection('messages').doc(currentConvId).update({ lastMsg: text, updatedAt: TS() });
    loadMsgs(currentConvId);
  }).catch(function() {
    // Affichage local si erreur
    var el = document.getElementById('chat-msgs');
    if (el) {
      el.innerHTML += '<div class="msg-bubble msg-mine">' + text + '<span class="msg-time">À l\'instant</span></div>';
      el.scrollTop = el.scrollHeight;
    }
  });
}

function openNewMsg() {
  openModal(
    '<button class="modal-close" onclick="closeModal()">✕</button>' +
    '<div class="modal-title">Nouveau message</div>' +
    '<div class="fg"><label>Destinataire / Groupe</label><input id="m-msgname" placeholder="Ex: Élèves Terminale, Direction…" autofocus></div>' +
    '<div class="fg"><label>Message</label><textarea id="m-msgtext" placeholder="Ton message…"></textarea></div>' +
    '<div class="modal-footer"><button class="btn btn-g" onclick="closeModal()">Annuler</button><button class="btn btn-p" onclick="createConv()">Envoyer</button></div>'
  );
}

function createConv() {
  var name = document.getElementById('m-msgname').value.trim();
  var text = document.getElementById('m-msgtext').value.trim();
  if (!name || !text) { toast('Remplis tous les champs.', 'error'); return; }
  db.collection('messages').add({
    name: name, uid: currentUser.uid,
    participants: [currentUser.uid],
    lastMsg: text, unread: false,
    color: 'var(--sage-l)', updatedAt: TS()
  }).then(function(ref) {
    return db.collection('messages').doc(ref.id).collection('msgs').add({ uid: currentUser.uid, text: text, createdAt: TS() })
    .then(function() { return ref.id; });
  }).then(function(convId) {
    toast('Message envoyé !', 'success');
    closeModal(); loadConvs();
    setTimeout(function() { openConv(convId); }, 500);
  });
}

// ────────────────────────────────────────────────────────────
// ═══ ANNONCES ═══
// ────────────────────────────────────────────────────────────
var TYPE_ICONS = { cours:'📚', evaluation:'📝', devoir:'📋', felicitations:'🏆', info:'ℹ️', rappel:'⏰' };
var TYPE_LABELS = { cours:'Cours', evaluation:'Évaluation', devoir:'Devoir', felicitations:'Félicitations', info:'Info', rappel:'Rappel' };
var TYPE_CLASSES = { cours:'bg', evaluation:'bt', devoir:'ba', felicitations:'bb', info:'binf', rappel:'bp' };

function loadAnnonces() {
  db.collection('annonces').where('uid', '==', currentUser.uid).orderBy('createdAt', 'desc').get()
  .then(function(snap) {
    allAnnonces = snap.docs.map(function(d) { return { id: d.id, data: d.data() }; });
    renderAnnonces();
  }).catch(function() {
    allAnnonces = [
      { id:'a1', data:{ type:'cours', authorName:'Marie Laurent', classe:'Terminale Pro MCV', content:'Nouveau cours disponible ! Le chapitre 4 sur la communication client est en ligne.', createdAt:null, likes:8, likesBy:[], commentsData:[{ author:'Léa M.', text:'Merci !' }] }},
      { id:'a2', data:{ type:'felicitations', authorName:'Marie Laurent', classe:'Toutes les classes', content:'Félicitations à toute la classe pour les excellents résultats ! Moyenne : 15.2/20 🎉', createdAt:null, likes:15, likesBy:[], commentsData:[] }}
    ];
    renderAnnonces();
  });
}

function renderAnnonces() {
  var items = annFilter === 'all' ? allAnnonces : allAnnonces.filter(function(a) { return a.data.type === annFilter; });
  var el    = document.getElementById('annonces-list');
  if (!items.length) { el.innerHTML = '<div class="empty"><div class="empty-ic">📢</div><div class="empty-txt">Aucune annonce.</div></div>'; return; }
  el.innerHTML = items.map(function(a) {
    var fd      = a.data;
    var icon    = TYPE_ICONS[fd.type] || 'ℹ️';
    var label   = TYPE_LABELS[fd.type] || fd.type;
    var cls     = TYPE_CLASSES[fd.type] || 'bg';
    var init    = (fd.authorName || 'M').split(' ').map(function(n){ return n[0]; }).join('').toUpperCase().slice(0,2);
    var liked   = fd.likesBy && fd.likesBy.indexOf(currentUser.uid) !== -1;
    var comms   = fd.commentsData || [];
    return '<div class="ann-card" id="ann-' + a.id + '">' +
      '<div class="ann-top">' +
        '<div class="ann-av">' + init + '</div>' +
        '<div class="ann-info">' +
          '<div class="ann-author">' + (fd.authorName || 'Enseignant') + '</div>' +
          '<div class="ann-meta"><span class="badge ' + cls + '">' + icon + ' ' + label + '</span> · ' + (fd.classe || 'Toutes') + ' · ' + timeAgo(fd.createdAt) + '</div>' +
        '</div>' +
        '<button class="btn btn-danger btn-sm" onclick="deleteAnn(\'' + a.id + '\')">🗑</button>' +
      '</div>' +
      '<div class="ann-body">' + fd.content + '</div>' +
      '<div class="ann-footer">' +
        '<button class="ann-like' + (liked ? ' liked' : '') + '" onclick="likeAnn(\'' + a.id + '\')" id="like-' + a.id + '">❤️ ' + (fd.likes || 0) + '</button>' +
        '<button class="ann-like" onclick="toggleComments(\'' + a.id + '\')">💬 ' + comms.length + ' commentaire(s)</button>' +
      '</div>' +
      '<div class="ann-comments" id="comm-' + a.id + '">' +
        (comms.length ? comms.map(function(c) { return '<div class="comment-item"><span class="comment-author">' + c.author + '</span>' + c.text + '</div>'; }).join('') : '<div style="font-size:11.5px;color:var(--ink-30);padding:4px 0">Aucun commentaire.</div>') +
        '<div class="add-comment">' +
          '<input id="comm-input-' + a.id + '" placeholder="Ton commentaire…" onkeydown="if(event.key===\'Enter\')addComment(\'' + a.id + '\')">' +
          '<button class="btn btn-p btn-sm" onclick="addComment(\'' + a.id + '\')">Envoyer</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function filterAnn(type, btn) {
  annFilter = type;
  document.querySelectorAll('.ann-filter').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  renderAnnonces();
}

function openNewAnnonce() {
  var typeOpts = Object.keys(TYPE_LABELS).map(function(k) {
    return '<option value="' + k + '">' + TYPE_ICONS[k] + ' ' + TYPE_LABELS[k] + '</option>';
  }).join('');
  openModal(
    '<button class="modal-close" onclick="closeModal()">✕</button>' +
    '<div class="modal-title">Nouvelle annonce</div>' +
    '<div class="fg"><label>Type</label><select id="m-anntype">' + typeOpts + '</select></div>' +
    '<div class="fg"><label>Classe(s)</label><input id="m-annclass" placeholder="Terminale Pro MCV / Toutes les classes"></div>' +
    '<div class="fg"><label>Contenu</label><textarea id="m-anncontent" placeholder="Ton annonce…" rows="5"></textarea></div>' +
    '<div class="modal-footer"><button class="btn btn-g" onclick="closeModal()">Annuler</button><button class="btn btn-p" onclick="createAnnonce()">Publier</button></div>'
  );
}

function createAnnonce() {
  var type    = document.getElementById('m-anntype').value;
  var classe  = document.getElementById('m-annclass').value.trim();
  var content = document.getElementById('m-anncontent').value.trim();
  if (!content) { toast('Écris un contenu.', 'error'); return; }
  db.collection('annonces').add({
    uid: currentUser.uid, type: type, classe: classe, content: content,
    authorName: currentUser.displayName || 'Enseignant',
    likes: 0, likesBy: [], commentsData: [], createdAt: TS()
  }).then(function() {
    toast('Annonce publiée !', 'success'); closeModal(); loadAnnonces();
  });
}

function deleteAnn(id) {
  if (!confirm('Supprimer cette annonce ?')) return;
  db.collection('annonces').doc(id).delete().then(function() {
    toast('Annonce supprimée.', 'success'); loadAnnonces();
  });
}

function likeAnn(id) {
  var a = allAnnonces.find(function(x) { return x.id === id; });
  if (!a) return;
  var liked  = (a.data.likesBy || []).indexOf(currentUser.uid) !== -1;
  var likesBy = a.data.likesBy || [];
  var likes   = a.data.likes || 0;
  if (liked) { likesBy = likesBy.filter(function(x) { return x !== currentUser.uid; }); likes = Math.max(0, likes - 1); }
  else       { likesBy.push(currentUser.uid); likes++; }
  db.collection('annonces').doc(id).update({ likes: likes, likesBy: likesBy }).then(function() {
    a.data.likes = likes; a.data.likesBy = likesBy;
    var btn = document.getElementById('like-' + id);
    if (btn) { btn.textContent = '❤️ ' + likes; btn.classList.toggle('liked', !liked); }
  });
}

function toggleComments(id) {
  var el = document.getElementById('comm-' + id);
  if (el) el.classList.toggle('open');
}

function addComment(id) {
  var input = document.getElementById('comm-input-' + id);
  var text  = (input ? input.value : '').trim();
  if (!text) return;
  var a = allAnnonces.find(function(x) { return x.id === id; });
  if (!a) return;
  var comms = a.data.commentsData || [];
  comms.push({ author: currentUser.displayName || 'Vous', text: text });
  db.collection('annonces').doc(id).update({ commentsData: comms }).then(function() {
    a.data.commentsData = comms;
    if (input) input.value = '';
    renderAnnonces();
    var el = document.getElementById('comm-' + id);
    if (el) el.classList.add('open');
    toast('Commentaire ajouté !', 'success');
  });
}

// ────────────────────────────────────────────────────────────
// ═══ NOTIFICATIONS ═══
// ────────────────────────────────────────────────────────────
function loadNotifs() {
  db.collection('notifications').where('uid', '==', currentUser.uid).orderBy('createdAt', 'desc').limit(20).get()
  .then(function(snap) {
    renderNotifs(snap.docs.map(function(d) { return { id: d.id, data: d.data() }; }));
  }).catch(function() {
    renderNotifs([
      { id:'n1', data:{ type:'devoir', title:'Devoir rendu', body:'Un élève a rendu son devoir "Analyse doc commercial"', isRead:false, createdAt:null }},
      { id:'n2', data:{ type:'reminder', title:'Rappel cours', body:'Tu as un cours avec Terminale Pro demain à 9h', isRead:true, createdAt:null }}
    ]);
  });
}

function renderNotifs(notifs) {
  var el = document.getElementById('notifs-list');
  var ICONS = { devoir:'📋', reminder:'⏰', message:'✉️', cours:'📚', correction:'✦' };
  if (!notifs.length) { el.innerHTML = '<div class="empty"><div class="empty-ic">🔔</div><div class="empty-txt">Aucune notification.</div></div>'; return; }
  el.innerHTML = notifs.map(function(n) {
    var fd   = n.data;
    var icon = ICONS[fd.type] || '🔔';
    return '<div class="notif-item ' + (fd.isRead ? '' : 'unread') + '" onclick="readNotif(\'' + n.id + '\')">' +
      '<div class="notif-ic">' + icon + '</div>' +
      '<div style="flex:1">' +
        '<div class="notif-title">' + fd.title + '</div>' +
        '<div class="notif-body">' + fd.body + '</div>' +
        '<div class="notif-time">' + timeAgo(fd.createdAt) + '</div>' +
      '</div>' +
      (!fd.isRead ? '<div class="conv-unread"></div>' : '') +
    '</div>';
  }).join('');
}

function readNotif(id) {
  db.collection('notifications').doc(id).update({ isRead: true }).then(function() { loadNotifs(); });
}

function markAllRead() {
  db.collection('notifications').where('uid', '==', currentUser.uid).where('isRead', '==', false).get()
  .then(function(snap) {
    var batch = db.batch();
    snap.docs.forEach(function(d) { batch.update(d.ref, { isRead: true }); });
    return batch.commit();
  }).then(function() { toast('Tout marqué comme lu.', 'success'); loadNotifs(); });
}
</script>
